<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Labyrinth</title>
    <script type="module" crossorigin src="/Labyrinth/assets/index-q1cLXIaI.js"></script>
    <link rel="stylesheet" crossorigin href="/Labyrinth/assets/index-BTa9z-DM.css">
  </head>
  <body>
    <div id="hud">
      <div id="status">Tilt the board · reach the green pad</div>
      <div id="controls">
        <label for="input-mode">Input:</label>
        <select id="input-mode">
          <option value="mouse">Mouse</option>
          <option value="keys">Keyboard (WASD / Arrows)</option>
          <option value="tilt">Device tilt</option>
        </select>
        <button id="recenter" hidden title="Recenter tilt" aria-label="Recenter tilt">⟳</button>
        <button id="reset">Reset</button>
      </div>
    </div>
    <canvas id="game"></canvas>
    <div id="banner" hidden>
      <div id="banner-text"></div>
      <button id="banner-reset">Reset</button>
    </div>
    <div id="start-overlay">
      <div class="start-card">
        <h1>Labyrinth</h1>
        <p>Tilt the board to roll the ball through the maze to the green portal.</p>
        <fieldset class="start-inputs">
          <legend>Controls</legend>
          <label><input type="radio" name="start-input" value="mouse" checked> Mouse</label>
          <label><input type="radio" name="start-input" value="keys"> Keyboard</label>
          <label><input type="radio" name="start-input" value="tilt"> Device tilt</label>
        </fieldset>
        <button id="start-button">Start</button>
        <p id="start-error"></p>
      </div>
    </div>
    <div id="motion-overlay" hidden>
      <div class="motion-card">
        <h2>Enable motion controls</h2>
        <p>iOS needs your permission to read the device tilt sensor.</p>
        <button id="motion-enable">Tap to enable</button>
        <button id="motion-cancel" class="ghost">Use mouse instead</button>
        <p id="motion-error"></p>
      </div>
    </div>
  </body>
</html>
